# House Portal OS — Nginx Configuration
# Serves React SPAs and proxies API/WebSocket to housepysbot

upstream http_backend {
    server http:3000;
}

server {
    listen 80;
    server_name _;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1000;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ── FCM Service Worker (needed at domain root) ──
    location = /firebase-messaging-sw.js {
        alias /usr/share/nginx/html/menu-app/firebase-messaging-sw.js;
    }

    # ── house-menu (Digital Menu + Staff + Admin) at root / ──
    # Serves at / for clean asset paths and QR-friendly URLs
    location / {
        root /usr/share/nginx/html/menu-app;
        try_files $uri $uri/ /index.html;
        # Cache static assets
        location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }
    }

    # ── Backward compat: menu-app subpath ────────────
    location ^~ /menu-app/assets/ {
        alias /usr/share/nginx/html/menu-app/assets/;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /menu-app/index.html {
        alias /usr/share/nginx/html/menu-app/index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /menu-app {
        alias /usr/share/nginx/html/menu-app;
        try_files $uri $uri/ /menu-app/index.html;
    }

    # ── Portal Empleados ──────────────────────────
    location /empleados {
        alias /usr/share/nginx/html/portal-hub;
        try_files $uri $uri/ /empleados/index.html;
    }

    # ── Reverse Proxy to housepysbot HTTP Server ─────

    # Health & Monitoring
    location /health {
        proxy_pass http://http_backend;
        proxy_set_header Host $host;
    }
    location /monitor {
        proxy_pass http://http_backend;
        proxy_set_header Host $host;
    }

    # QR Menu (customer-facing, served at /menu)
    location /menu {
        proxy_pass http://http_backend;
        proxy_set_header Host $host;
    }

    # KDS (Kitchen Display)
    location /kds {
        proxy_pass http://http_backend;
        proxy_set_header Host $host;
    }

    # Webhooks (delivery integrations)
    location /api/webhooks {
        proxy_pass http://http_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Webhook-Secret $http_x_webhook_secret;
    }

    # Admin API (MCP tools)
    location /api/ {
        proxy_pass http://http_backend;
        proxy_set_header Host $host;
    }

    # WebSocket for WhatsApp QR
    location /socket.io/ {
        proxy_pass http://http_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
