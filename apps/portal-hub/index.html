<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ayni Hub — Ecosistema EmprendeAI</title>
  <meta name="description" content="Centro de operaciones Ayni para los servicios House Portal OS.">
  <link rel="stylesheet" href="/style.css">
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <style>
    .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
    }
    body {
        font-family: 'Space Grotesk', sans-serif;
    }
    
    /* Neo-Brutalist utility classes */
    .brutal-border {
        border: 2px solid #1c1b1b;
    }
    .brutal-border-thick {
        border: 4px solid #1c1b1b;
    }
    .brutal-shadow {
        box-shadow: 4px 4px 0px 0px #1c1b1b;
        transition: transform 0.1s, box-shadow 0.1s;
    }
    .brutal-shadow:hover {
        transform: translate(2px, 2px);
        box-shadow: 2px 2px 0px 0px #1c1b1b;
    }
    .brutal-shadow:active {
        transform: translate(4px, 4px);
        box-shadow: 0px 0px 0px 0px #1c1b1b;
    }
    .card-loading {
        font-weight: 700;
        text-transform: uppercase;
        padding: 2rem;
        grid-column: 1 / -1;
        text-align: center;
        border: 2px dashed #1c1b1b;
    }
  </style>
  <script id="tailwind-config">
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            "primary": "#735c00",
            "on-primary": "#ffffff",
            "primary-container": "#d4af37",
            "on-primary-container": "#554300",
            "secondary": "#a93818",
            "on-secondary": "#ffffff",
            "secondary-container": "#fd7550",
            "tertiary": "#366287",
            "background": "#fcf9f8",
            "on-background": "#1c1b1b",
            "surface": "#fcf9f8",
            "on-surface": "#1c1b1b",
            "surface-variant": "#e5e2e1",
            "outline": "#1c1b1b",
            "error": "#ba1a1a"
          },
          borderRadius: {
            "none": "0px",
            "sm": "0px",
            DEFAULT: "0px",
            "md": "0px",
            "lg": "0px",
            "xl": "0px",
            "2xl": "0px",
            "3xl": "0px",
            "full": "0px",
          },
          spacing: {
            "gutter": "24px",
            "margin-mobile": "16px",
            "margin-desktop": "48px"
          }
        }
      }
    }
  </script>
</head>
<body class="bg-background text-on-background min-h-screen">
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
