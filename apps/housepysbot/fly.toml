app = "housepysbot"
primary_region = "iad"

[build]
  builder = "heroku/buildpacks:20"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 0

[checks]
  [checks.system]
    port = 3000
    type = "http"
    path = "/health"
    method = "GET"
    interval = "60s"
    timeout = "5s"
