services:
  - type: web
    name: housepysbot
    env: docker
    repo: https://github.com/housemenu-creator/HouseMenuOS
    branch: main
    rootDir: apps/housepysbot
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: llama-3.3-70b-versatile
      - key: OPENROUTER_FALLBACK
        value: llama3-70b-8192
      - key: FIREBASE_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_DATABASE_URL
        sync: false
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: WHATSAPP_ENABLED
        value: "false"
      - key: WHATSAPP_SESSION_DIR
        value: ./wa_session
      - key: ADMIN_CHAT_ID
        sync: false
      - key: HOUSEPYSBOT_BRANCH_ID
        value: "monteverde"
      - key: BOT_FIREBASE_EMAIL
        sync: false
      - key: BOT_FIREBASE_PASSWORD
        sync: false
      - key: NVIDIA_API_KEY
        sync: false
