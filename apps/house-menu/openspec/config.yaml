# OpenSpec SDD Configuration
schema: spec-driven

context: |
  Tech stack: React 19 + Vite 8 + JavaScript (ES modules), monorepo workspace
  Architecture: Component-based with hooks, Zustand stores, Framer Motion animations
  Testing: Vitest + jsdom + @testing-library/react, v8 coverage
  Firebase: RTDB + Auth + Storage, Firebase Emulators available
  Style: Tailwind CSS with cm-* design tokens (glassmorphism)

rules:
  proposal:
    - Include rollback plan for risky changes
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
  design:
    - Include sequence diagrams for complex flows
    - Document architecture decisions with rationale
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep tasks completable in one session
  apply:
    - Follow existing code patterns (AnimatePresence, cm-* tokens)
    tdd: true
    test_command: "npm run test"
  verify:
    test_command: "npm run test"
    build_command: "npm run build"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas

strict_tdd: true

testing:
  runner: vitest
  command: "npm run test"
  coverage:
    available: true
    command: "vitest run --coverage"
    provider: v8
  layers:
    unit: true
    integration: false
    e2e: false
  quality:
    linter: false
    type_checker: false
    formatter: false